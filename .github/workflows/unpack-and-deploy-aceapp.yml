name: Update Aceapp from v50 Startup Hotfix ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ZIP
        shell: bash
        run: |
          ZIP_FILE="./aceapp-release-v50-startup-hotfix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required file not found: $ZIP_FILE"
            echo "Upload aceapp-release-v50-startup-hotfix.zip to the repository root, then run this workflow again."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Replace website files with v50
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"

          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          rm -rf plates assets netlify

          rm -f index.html \
            manifest.webmanifest \
            sw.js \
            firestore.rules \
            netlify.toml \
            FIREBASE_SETUP.md \
            ADMIN_SETUP.md \
            PAYMENTS_SETUP.md \
            SUPPORT_SETUP.md \
            MADE_TO_STICK_NOTES.md \
            ANATOMY_QA.md \
            DEPLOY_NETLIFY.md \
            RELEASE_NOTES.md

          cp -a "$TMP_DIR"/. ./

          rm -f "$ZIP_FILE"
          rm -rf "$TMP_DIR"

      - name: Verify v50 startup hotfix
        shell: bash
        run: |
          test -f index.html
          test -f sw.js
          test -f firestore.rules
          test -d plates
          test -f assets/bpi-instapay-qr.png

          grep -q "const ACEAPP_RELEASE = 'v50'" index.html
          grep -q "AceappErrorBoundary" index.html
          grep -q "Clear app cache & reload" index.html
          grep -q "esm.unpkg.com/react@18.3.1" index.html

          grep -q "READINESS MATRIX" index.html
          grep -q "paypal.com/ncp/payment/23PT4EVR3Q34C" index.html

          grep -q "aceapp-v50-startup-hotfix" sw.js

          ! grep -q "esm.sh/react@18.3.1" index.html
          ! grep -qi "xendit" index.html
          ! grep -qi "gcash" index.html

          python - <<'PY'
          from pathlib import Path
          import re

          s = Path("index.html").read_text()

          m = re.search(
              r'<script type="module">\s*(.*?)\s*</script>',
              s,
              re.S
          )

          if not m:
              raise SystemExit("Module script not found")

          Path("/tmp/aceapp-module.mjs").write_text(m.group(1))
          PY

          node --check /tmp/aceapp-module.mjs
          node --check sw.js

          echo "Aceapp v50 startup hotfix verification passed."

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Aceapp v50 startup hotfix"
            git push
          else
            echo "No changes to commit."
          fi
