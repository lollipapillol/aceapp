name: Unpack and deploy Aceapp — Made to Stick

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Made-to-Stick ZIP
        shell: bash
        run: |
          ZIP_FILE="./aceapp-site-firebase-made-to-stick.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required file not found: $ZIP_FILE"
            echo "Upload aceapp-site-firebase-made-to-stick.zip to the repository root, then run this workflow again."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Deploying exactly: $ZIP_FILE"

      - name: Unpack Made-to-Stick build
        shell: bash
        run: |
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Verify Made-to-Stick code is present
        shell: bash
        run: |
          if ! grep -q "Right main bronchus.*Picture this" index.html; then
            echo "Made-to-Stick verification failed: expected sticky-learning marker not found in index.html"
            exit 1
          fi

          if ! grep -q "Use a memory hook only when it genuinely helps" index.html; then
            echo "Made-to-Stick verification failed: mnemonic policy marker not found in index.html"
            exit 1
          fi

          echo "Made-to-Stick verification passed."

      - name: Commit unpacked website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Aceapp Made-to-Stick build"
            git push
          else
            echo "Nothing changed."
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: unpack

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
