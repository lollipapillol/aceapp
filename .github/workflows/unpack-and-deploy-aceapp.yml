name: Unpack and deploy Aceapp

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Aceapp ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'aceapp-site*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No Aceapp ZIP found in the repository root."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Unpack Aceapp into repository root
        shell: bash
        run: |
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Commit unpacked website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Unpack Aceapp website"
            git push
          else
            echo "Nothing changed."
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: unpack

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
