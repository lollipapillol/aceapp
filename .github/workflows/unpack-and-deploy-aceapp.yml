name: Update Aceapp from v49 Readiness Matrix release ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ZIP
        shell: bash
        run: |
          ZIP_FILE="./aceapp-release-v49-readiness-matrix.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required file not found: $ZIP_FILE"
            echo "Upload aceapp-release-v49-readiness-matrix.zip to the repository root, then run this workflow again."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Replace website files with release
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          rm -rf plates assets netlify

          rm -f index.html \
            manifest.webmanifest \
            sw.js \
            firestore.rules \
            netlify.toml \
            FIREBASE_SETUP.md \
            ADMIN_SETUP.md \
            PAYMENTS_SETUP.md \
            SUPPORT_SETUP.md \
            MADE_TO_STICK_NOTES.md \
            ANATOMY_QA.md \
            DEPLOY_NETLIFY.md \
            RELEASE_NOTES.md

          cp -a "$TMP_DIR"/. ./

          rm -f "$ZIP_FILE"
          rm -rf "$TMP_DIR"

      - name: Verify v49 Readiness Matrix release
        shell: bash
        run: |
          test -f index.html
          test -d plates
          test -f firestore.rules
          test -f ADMIN_SETUP.md
          test -f assets/bpi-instapay-qr.png

          grep -q "const ACEAPP_RELEASE = 'v49'" index.html
          grep -q "READINESS MATRIX" index.html
          grep -q "runItemPrescription" index.html
          grep -q "Train localization" index.html
          grep -q "Train free recall" index.html
          grep -q "Fade the cues" index.html
          grep -q "Shift the view" index.html
          grep -q "Reduce context" index.html
          grep -q "buildCropChallenge" index.html
          grep -q "buildCueFade" index.html
          grep -q "buildViewShiftSession" index.html
          grep -q "Smart Daily Sprint" index.html
          grep -q "Spotter simulation" index.html
          grep -q "paypal.com/ncp/payment/23PT4EVR3Q34C" index.html
          grep -q "aceapp-v49-readiness-matrix" sw.js
          grep -q "match /admins/{adminId}" firestore.rules
          ! grep -qi "xendit" index.html
          ! grep -qi "gcash" index.html

          echo "Aceapp v49 Readiness Matrix release verification passed."

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Aceapp v49 Readiness Matrix"
            git push
          else
            echo "No changes to commit."
          fi
