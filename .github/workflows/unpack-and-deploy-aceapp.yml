name: Update Aceapp from v49.1 startup hotfix ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ZIP
        shell: bash
        run: |
          ZIP_FILE="./aceapp-release-v49-1-startup-hotfix.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required file not found: $ZIP_FILE"
            echo "Upload aceapp-release-v49-1-startup-hotfix.zip to the repository root, then run this workflow again."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Replace website files with hotfix
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          rm -rf plates assets netlify

          rm -f index.html \
            manifest.webmanifest \
            sw.js \
            firestore.rules \
            netlify.toml \
            FIREBASE_SETUP.md \
            ADMIN_SETUP.md \
            PAYMENTS_SETUP.md \
            SUPPORT_SETUP.md \
            MADE_TO_STICK_NOTES.md \
            ANATOMY_QA.md \
            DEPLOY_NETLIFY.md \
            RELEASE_NOTES.md

          cp -a "$TMP_DIR"/. ./

          rm -f "$ZIP_FILE"
          rm -rf "$TMP_DIR"

      - name: Verify v49.1 startup hotfix
        shell: bash
        run: |
          test -f index.html
          test -d plates
          test -f firestore.rules
          test -f ADMIN_SETUP.md
          test -f assets/bpi-instapay-qr.png

          grep -q "const ACEAPP_RELEASE = 'v49.1'" index.html
          grep -q "READINESS MATRIX" index.html
          grep -q "Keep every hook above the loading-screen early return" index.html
          grep -q "aceapp-v49-1-startup-hotfix" sw.js
          grep -q "paypal.com/ncp/payment/23PT4EVR3Q34C" index.html

          ! grep -qi "xendit" index.html
          ! grep -qi "gcash" index.html

          python - <<'PY'
          from pathlib import Path

          text = Path('index.html').read_text()

          load_return = text.index('if (!loaded) {')

          hook_tokens = (
              'useState(',
              'useEffect(',
              'useMemo(',
              'useCallback(',
              'useRef(',
              'useReducer('
          )

          after = text[load_return:]

          bad = [
              token
              for token in hook_tokens
              if token in after
          ]

          if bad:
              raise SystemExit(
                  f'Hook-order verification failed; '
                  f'hooks found after loading return: {bad}'
              )

          print('React hook-order verification passed.')
          PY

          echo "Aceapp v49.1 startup hotfix verification passed."

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Aceapp v49.1 startup hotfix"
            git push
          else
            echo "No changes to commit."
          fi
