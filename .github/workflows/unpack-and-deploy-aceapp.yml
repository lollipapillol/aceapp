name: Update Aceapp from v28 release ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release ZIP
        shell: bash
        run: |
          ZIP_FILE="./aceapp-release-v28-private-support.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required file not found: $ZIP_FILE"
            echo "Upload aceapp-release-v28-private-support.zip to the repository root, then run this workflow again."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Replace website files with release
        shell: bash
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          # Remove files/folders from the previous Aceapp release
          rm -rf plates assets netlify

          rm -f index.html \
            manifest.webmanifest \
            sw.js \
            firestore.rules \
            netlify.toml \
            FIREBASE_SETUP.md \
            PAYMENTS_SETUP.md \
            SUPPORT_SETUP.md \
            MADE_TO_STICK_NOTES.md \
            ANATOMY_QA.md \
            DEPLOY_NETLIFY.md \
            RELEASE_NOTES.md

          # Copy the new release into the repository root
          cp -a "$TMP_DIR"/. ./

          # Remove uploaded ZIP after extraction
          rm -f "$ZIP_FILE"
          rm -rf "$TMP_DIR"

      - name: Verify v28 release markers
        shell: bash
        run: |
          test -f index.html
          test -d plates
          test -f assets/bpi-instapay-qr.png

          grep -q "cardio/heart-external" index.html
          grep -q "Try the Heart Challenge" index.html
          grep -q "ACE YOUR EXAMS ASAP" index.html
          grep -q "WHAT YOU CHOSE" index.html

          grep -q "paypal.com/ncp/payment/23PT4EVR3Q34C" index.html
          grep -q "BPI / InstaPay QR" index.html

          ! grep -qi "xendit" index.html
          ! grep -qi "gcash" index.html

          echo "Aceapp v28 privacy-first support release verification passed."

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Aceapp v28 privacy-first support"
            git push
          else
            echo "No changes to commit."
          fi
