function normalizeAnswer(value) {

        .normalize('NFKD')

const SAVE_KEY = 'aceapp.v4';
async function loadSave() {
    const blank = { xp: 0, streak: 0, lastDay: null, mastered: {}, misses: {}, seen: {}, reviews: {}, activityDays: [], confusions: {}, skills: {} };
    try {
        // Some prototype hosts expose window.storage. Prefer it when available,
        // but fall back to localStorage so progress survives in a normal browser.
        if (window.storage?.get) {
            const res = await window.storage.get(SAVE_KEY);
            return res ? { ...blank, ...JSON.parse(res.value) } : blank;
        }
        const raw = window.localStorage?.getItem(SAVE_KEY);
        return raw ? { ...blank, ...JSON.parse(raw) } : blank;
    }
    catch {
        return blank;
    }
}
async function putSave(next) {
    const raw = JSON.stringify(next);
    try {
        if (window.storage?.set) {
            await window.storage.set(SAVE_KEY, raw);
        } else {
            window.localStorage?.setItem(SAVE_KEY, raw);
        }
    }
    catch {
        // Storage can be unavailable in private/embedded contexts. The session
        // still works; it simply cannot persist progress between reloads.
    }
    // Cloud writes are intentionally debounced so a fast drill does not create
    // a Firestore write for every single tap.
    queueFirebasePatch({ progress: next });
}
function mergeRecordMax(a = {}, b = {}) {
    const out = { ...a };
    Object.entries(b || {}).forEach(([key, value]) => {
        out[key] = Math.max(Number(out[key] || 0), Number(value || 0));
    });
    return out;
}
function mergeSkillMaps(a = {}, b = {}) {
    const out = { ...a };
    Object.entries(b || {}).forEach(([key, skill]) => {
        const prior = out[key] || {};
        out[key] = {
            recognized: Boolean(prior.recognized || skill?.recognized),
            located: Boolean(prior.located || skill?.located),
            recalled: Boolean(prior.recalled || skill?.recalled),
            retained: Boolean(prior.retained || skill?.retained)

    });
    return out;
}
function mergeReviews(a = {}, b = {}) {
    const out = { ...a };
    Object.entries(b || {}).forEach(([key, incoming]) => {
        const current = out[key];
        if (!current || String(incoming?.lastAnswered || '') >= String(current?.lastAnswered || '')) out[key] = incoming;
    });

}
function mergeSaveData(local = {}, cloud = {}) {
    const blank = { xp: 0, streak: 0, lastDay: null, mastered: {}, misses: {}, seen: {}, reviews: {}, activityDays: [], confusions: {}, skills: {} };
    const l = { ...blank, ...(local || {}) }, c = { ...blank, ...(cloud || {}) };
    const lastDay = String(c.lastDay || '') > String(l.lastDay || '') ? c.lastDay : l.lastDay;
    return {
        xp: Math.max(Number(l.xp || 0), Number(c.xp || 0)),
        streak: lastDay === c.lastDay ? Number(c.streak || 0) : Number(l.streak || 0),
        lastDay: lastDay || null,

        seen: { ...(l.seen || {}), ...(c.seen || {}) },
        reviews: mergeReviews(l.reviews, c.reviews),

function shuffle(a) {
    // Fisher-Yates gives an unbiased shuffle; Array.sort(Math.random) does not.
    const out = [...a];
    for (let i = out.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
}
